<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R07 ELITE EXAM | LRK INSTITUTE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --red: #ff0000; --dark: #000; --glow: rgba(255, 0, 0, 0.4); }
        
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--dark); color: white; margin: 0; 
            height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        /* Scanline Animation */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--red); opacity: 0.3; box-shadow: 0 0 15px var(--red);
            animation: scan 4s linear infinite; z-index: 10; pointer-events: none;
        }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        /* R07 Watermark */
        .watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 25vw; font-weight: 900; color: rgba(255, 0, 0, 0.03);
            z-index: -1; user-select: none;
        }

        .panel { 
            background: rgba(10, 10, 10, 0.9); width: 95%; max-width: 600px; 
            padding: 40px; border: 2px solid var(--red); border-radius: 20px;
            box-shadow: 0 0 40px var(--glow); position: relative; z-index: 20;
        }

        h1 { color: var(--red); text-align: center; letter-spacing: 5px; margin: 0; text-shadow: 0 0 10px var(--red); }
        .inst-name { text-align: center; font-size: 12px; color: #888; margin-bottom: 30px; letter-spacing: 2px; }

        input {
            width: 100%; padding: 15px; margin: 10px 0; background: #080808;
            border: 1px solid #333; color: white; border-radius: 10px; font-size: 16px;
        }
        input:focus { border-color: var(--red); outline: none; box-shadow: 0 0 10px var(--glow); }

        .btn-start {
            width: 100%; padding: 18px; background: var(--red); color: white; border: none;
            border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px;
            text-transform: uppercase; margin-top: 20px; transition: 0.3s;
        }
        .btn-start:hover { box-shadow: 0 0 20px var(--red); transform: scale(1.02); }

        /* Quiz UI */
        #quiz-screen, #result-screen { display: none; }
        .q-info { color: var(--red); font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .eng-q { font-size: 1.2rem; font-weight: 600; line-height: 1.4; }
        .hin-q { color: #ff6666; font-style: italic; margin-top: 10px; font-size: 1rem; }

        .options-grid { margin-top: 25px; }
        .opt-card {
            background: #111; padding: 15px; margin: 10px 0; border-radius: 12px;
            border: 1px solid #222; cursor: pointer; transition: 0.2s;
        }
        .opt-card:hover { border-color: var(--red); background: #1a0000; }
        .opt-card.active { background: var(--red); border-color: white; }

        #loader { text-align: center; color: var(--red); font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="watermark">R07</div>

    <div class="panel">
        <div id="login-screen">
            <h1>R07 PRO</h1>
            <div class="inst-name">LRK COMPUTER INSTITUTE - MIHINPURWA</div>
            
            <input type="text" id="stuName" placeholder="ENTER FULL NAME">
            <input type="number" id="stuPhone" placeholder="ENTER MOBILE NUMBER">
            
            <button class="btn-start" onclick="startTest()">AUTHORIZE ACCESS</button>
            <p id="loading-msg" style="text-align:center; display:none; color:var(--red);">SYNCING WITH CLOUD SERVER...</p>
        </div>

        <div id="quiz-screen">
            <div class="q-info" id="qStatus">QUESTION 1 / 100</div>
            
            <div class="eng-q" id="engQ">Loading Question...</div>
            <div class="hin-q" id="hinQ">Anuvad ho raha hai...</div>

            <div class="options-grid" id="optionsBox"></div>

            <button class="btn-start" id="nextBtn" onclick="nextQ()">SAVE & NEXT</button>
        </div>

        <div id="result-screen" style="text-align:center;">
            <h2 style="color:var(--red);">EXAM COMPLETED</h2>
            <p>Score has been successfully uploaded to LRK database.</p>
            <div id="finalScore" style="font-size: 4rem; font-weight: 900; margin: 20px 0;">0/0</div>
            <button class="btn-start" onclick="location.reload()">LOGOUT SYSTEM</button>
        </div>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIArbfM8Z1rWkGh8OpJMbSrdGN7Fenh3ffG8jX_WeGKuuSwG6P-hFMkWqF_wOD-6fS/exec";
    
    let questions = [], curIdx = 0, score = 0, answers = [], student = {}, startTime;

    // Translation Function (Auto-detect English to Hindi)
    async function translate(text) {
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=hi&dt=t&q=${encodeURI(text)}`);
            const data = await res.json();
            return data[0][0][0];
        } catch(e) { return "..."; }
    }

    async function startTest() {
        const name = document.getElementById('stuName').value;
        const phone = document.getElementById('stuPhone').value;

        if(!name || phone.length < 10) return alert("Please enter Name and 10-digit Phone!");

        document.getElementById('loading-msg').style.display = "block";
        document.querySelector('.btn-start').disabled = true;

        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            questions = data.questions.slice(1).map(x => ({
                id: x[0], q: x[1], a: x[2], b: x[3], c: x[4], d: x[5], ans: x[6]
            }));

            if(questions.length === 0) throw new Error("No questions found");

            student = { name, phone };
            startTime = new Date(); // Time note kiya
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            loadQ();
        } catch (e) {
            alert("Server Connection Error!");
            location.reload();
        }
    }

    async function loadQ() {
        const q = questions[curIdx];
        document.getElementById('qStatus').innerText = `QUESTION ${curIdx + 1} / ${questions.length}`;
        document.getElementById('engQ').innerText = q.q;
        document.getElementById('hinQ').innerText = await translate(q.q);
