<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Exam Portal | LRK Computer Institute</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --primary: #1a73e8; --dark: #0d47a1; --accent: #ffd700;
            --bg: #f4f7fa; --white: #ffffff; --text: #202124;
            --success: #1e8e3e; --danger: #d93025; --border: #dadce0;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); margin: 0; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; color: var(--text);
        }

        .app-container { 
            background: var(--white); width: 95%; max-width: 650px; 
            border-radius: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); 
            overflow: hidden; transition: 0.3s; margin: 20px 0;
        }

        .app-container.wide-mode {
            max-width: 1150px;
            width: 98%;
        }

        .brand-header { 
            background: var(--dark); color: white; padding: 25px 20px; 
            text-align: center; border-bottom: 5px solid var(--accent);
        }
        .brand-header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }

        .progress-track { height: 6px; background: #e0e0e0; width: 100%; }
        #pBar { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }

        .view-content { padding: 30px 25px; }

        .input-field { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: #5f6368; }
        input { 
            width: 100%; padding: 15px; border: 2px solid var(--border); 
            border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--primary); background: #f8fbff; }

        .btn-prime { 
            background: var(--primary); color: white; border: none; width: 100%; 
            padding: 18px; border-radius: 14px; font-weight: 600; font-size: 16px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-prime:hover { background: var(--dark); }

        .timer-box { background: #fff0f0; color: var(--danger); padding: 5px 12px; border-radius: 8px; font-weight: bold; display: flex; align-items: center; gap: 5px; }

        /* 2 Side Split View Layout Layout */
        .split-container { display: flex; gap: 20px; padding: 20px; background: #fafafa; }
        .side-panel { flex: 1; background: var(--white); border-radius: 16px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); border: 1px solid #eef0f2; }
        .side-title { font-size: 13px; font-weight: bold; color: var(--primary); background: #e8f0fe; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 15px; }
        .side-title.hindi-lbl { color: #e65100; background: #fff3e0; }

        .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; color: var(--dark); min-height: 60px; margin-bottom: 20px; }
        
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-item { 
            display: flex; align-items: center; padding: 14px; 
            border: 2px solid var(--border); border-radius: 12px; 
            cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        .option-item:hover { border-color: var(--primary); background: #f8fbff; }
        .option-item.active { border-color: var(--primary); background: #e8f0fe; font-weight: 600; }
        
        .opt-id { 
            width: 28px; height: 28px; background: #f1f3f4; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px; font-size: 12px; font-weight: bold;
        }
        .option-item.active .opt-id { background: var(--primary); color: white; }

        /* Review Design Layout */
        .review-item { border-bottom: 2px solid #eee; padding: 25px 0; margin-bottom: 10px; }
        .review-split { display: flex; gap: 15px; margin-bottom: 10px; }
        .rev-side { flex: 1; font-size: 14px; background: #f8f9fa; padding: 10px; border-radius: 8px; }
        .review-opt { padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin: 6px 0; font-size: 14px; display: flex; gap: 10px; align-items: center; }
        .rev-correct { background: #e8f5e9; border-color: var(--success); color: var(--success); font-weight: 600; }
        .rev-wrong { background: #ffebee; border-color: var(--danger); color: var(--danger); font-weight: 600; }
        .ans-badge { display: inline-block; background: #e8f0fe; color: var(--dark); padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 10px; }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-container" id="appBody">
    <div id="authView" class="fade-in">
        <header class="brand-header">
            <h1>LRK COMPUTER INSTITUTE</h1>
            <p style="margin:5px 0 0; font-size:10px; opacity:0.8;">ISO 9001:2015 CERTIFIED • GOVT RECOGNIZED</p>
        </header>

        <div class="view-content">
            <div style="text-align:center; margin-bottom:25px;">
                <h2 style="margin:0; font-size:18px;">Student Mega Exam Login</h2>
                <p style="font-size:12px; color:#666;">Kripya apni sahi jaankari se login karein (100 Questions)</p>
            </div>

            <div class="input-field">
                <label>FULL NAME / पूरा नाम</label>
                <input type="text" id="nameInp" placeholder="Enter your name" autocomplete="off">
            </div>

            <div class="input-field">
                <label>WHATSAPP NUMBER / व्हाट्सएप नंबर</label>
                <input type="number" id="phoneInp" placeholder="10-digit number">
            </div>

            <button class="btn-prime" onclick="startExam()">
                START EXAM / परीक्षा शुरू करें <i class="fas fa-play"></i>
            </button>
        </div>
    </div>

    <div id="quizView" style="display:none;">
        <div class="progress-track"><div id="pBar"></div></div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:#f8f9fa; font-size:13px; font-weight:600;">
            <span id="qCount" style="color:var(--primary);">Question 1/100</span>
            <div class="timer-box"><i class="fas fa-clock"></i> <span id="timerText">90:00</span></div>
        </div>

        <div class="split-container">
            <div class="side-panel">
                <span class="side-title"><i class="fas fa-globe-americas"></i> English View</span>
                <div class="q-text" id="qEng">Loading question...</div>
                <div class="options-list" id="optionGridEng"></div>
            </div>

            <div class="side-panel">
                <span class="side-title hindi-lbl"><i class="fas fa-language"></i> हिंदी अनुवाद (Hindi)</span>
                <div class="q-text" id="qHin">प्रश्न लोड हो रहा है...</div>
                <div class="options-list" id="optionGridHin"></div>
            </div>
        </div>
        
        <div style="padding: 0 20px 20px 20px;">
            <button class="btn-prime" onclick="nextStep()">
                SAVE & NEXT / अगला प्रश्न <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>

<script>
    // Aapka valid Web App URL link yahan hai
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypq0a5mRG2pFLs63pyvoxgLz-9w4wPrLbCWI8dVL1VPqT4sX5Obh7f3dq0htjT3oDT/exec";
    
    let allQuestions = [];
    let sessionQs = [];
    let currentIdx = 0;
    let score = 0;
    let studentInfo = {};
    let studentResponses = [];

    let totalSeconds = 90 * 60; 
    let timerInterval = null;
    let startTimeStamp = null;

    // Split Function: Jo '/' format ko alag-alag karke portal par bhejta hai
    function parseLanguageSplit(rawText, getHindi = false) {
        if (!rawText) return "";
        let textStr = rawText.toString().trim();
        if (textStr.includes("/")) {
            let parts = textStr.split("/");
            return getHindi ? parts[1].trim() : parts[0].trim();
        }
        // Fallback safety logic
        return textStr;
    }

    async function startExam() {
        const name = document.getElementById('nameInp').value.trim();
        const phone = document.getElementById('phoneInp').value.trim();

        if(name.length < 3 || phone.length < 10) return alert("Please enter valid Name and 10-digit Phone!");

        studentInfo = { name, phone };
        startTimeStamp = Date.now(); 
        
        const startTime = new Date().toLocaleString();
        const loginPayload = {
            type: 'logs',
            action: 'save',
            row: [startTime, studentInfo.name, studentInfo.phone, "0/100", "STARTED (Pending)", "Level 1", "0s"]
        };
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(loginPayload) });

        document.getElementById('authView').innerHTML = `
            <div style="padding:100px 20px; text-align:center;">
                <div class="loader"></div>
                <h3 style="color:var(--primary)">Loading Fresh Dual-Language Exam...</h3>
                <p style="font-size:12px; color:#666;">Database synchronize ho raha hai, kripya thoda wait karein...</p>
            </div>
        `;

        try {
            // Cache bypass karne ke liye unique timestamp query string jod di hai
            const res = await fetch(`${SCRIPT_URL}?_cb=${Date.now()}`);
            const db = await res.json();
            
            let rawQuestions = db.questions && db.questions.length > 1 ? db.questions.slice(1).filter(r => r[1]) : [];
            
            if(rawQuestions.length === 0) {
                alert("No questions found in database!");
                return location.reload();
            }

            const seenTexts = new Set();
            allQuestions = rawQuestions.filter(q => {
                const normalizedText = q[1].toString().trim().toLowerCase();
                if (seenTexts.has(normalizedText)) return false;
                seenTexts.add(normalizedText);
                return true;
            });

            const totalToPick = Math.min(allQuestions.length, 100);
            sessionQs = allQuestions.sort(() => 0.5 - Math.random()).slice(0, totalToPick);
            
            // Layout ko wide format mein convert karein taaki 2 sides acche se dikhein
            document.getElementById('appBody').classList.add('wide-mode');
            document.getElementById('authView').style.display = 'none';
            document.getElementById('quizView').style.display = 'block';
            
            startCountdown(); 
            showQuestion();
        } catch (e) {
            alert("Database Connection Error! Reloading portal...");
            location.reload();
        }
    }

    function startCountdown() {
        timerInterval = setInterval(() => {
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                alert("Time Over! Aapka paper automatic submit ho raha hai.");
                finishExam();
                return;
            }
            totalSeconds--;
            let hrs = Math.floor(totalSeconds / 3600);
            let mins = Math.floor((totalSeconds % 3600) / 60);
            let secs = totalSeconds % 60;
            document.getElementById('timerText').innerText = 
                (hrs > 0 ? (hrs < 10 ? "0"+hrs : hrs) + ":" : "") + 
                (mins < 10 ? "0"+mins : mins) + ":" + (secs < 10 ? "0"+secs : secs);
        }, 1000);
    }

    function showQuestion() {
        const q = sessionQs[currentIdx];
        document.getElementById('qCount').innerText = `Question ${currentIdx + 1} of ${sessionQs.length}`;
        document.getElementById('pBar').style.width = `${((currentIdx + 1) / sessionQs.length) * 100}%`;

        // Left aur Right panels ke text set karein
        document.getElementById('qEng').innerText = parseLanguageSplit(q[1], false);
        document.getElementById('qHin').innerText = parseLanguageSplit(q[1], true);

        const gridEng = document.getElementById('optionGridEng');
        const gridHin = document.getElementById('optionGridHin');
        
        gridEng.innerHTML = "";
        gridHin.innerHTML = "";
        
        const labels = ['A', 'B', 'C', 'D'];
        
        [q[2], q[3], q[4], q[5]].forEach((txt, i) => {
            if(txt && txt.toString().trim() !== "" && txt.toString().trim() !== "-") {
                
                let optEngText = parseLanguageSplit(txt, false);
                let optHinText = parseLanguageSplit(txt, true);

                // English Option Element
                const optEng = document.createElement('div');
                optEng.className = `option-item o-item-${labels[i]} fade-in`;
                optEng.innerHTML = `<div class="opt-id">${labels[i]}</div> <span>${optEngText}</span>`;
                optEng.onclick = () => selectOption(labels[i]);

                // Hindi Option Element
                const optHin = document.createElement('div');
                optHin.className = `option-item o-item-${labels[i]} fade-in`;
                optHin.innerHTML = `<div class="opt-id">${labels[i]}</div> <span>${optHinText}</span>`;
                optHin.onclick = () => selectOption(labels[i]);

                gridEng.appendChild(optEng);
                gridHin.appendChild(optHin);
            }
        });
    }

    // Synchronized Option Selection
    function selectOption(label) {
        document.querySelectorAll('.option-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll(`.o-item-${label}`).forEach(el => {
            el.classList.add('active');
            el.dataset.ans = label;
        });
    }

    function nextStep() {
        const selected = document.querySelector('.option-item.active');
        if(!selected) return alert("Kripya ek option chunein! / कृपया एक विकल्प चुनें!");

        const selectedLetter = selected.dataset.ans;
        const correctLetter = sessionQs[currentIdx][6].toString().trim().toUpperCase();

        if(selectedLetter === correctLetter) score++;

        studentResponses.push({
            question: sessionQs[currentIdx][1],
            options: [sessionQs[currentIdx][2], sessionQs[currentIdx][3], sessionQs[currentIdx][4], sessionQs[currentIdx][5]],
            userAns: selectedLetter,
            correctAns: correctLetter
        });

        currentIdx++;
        if(currentIdx < sessionQs.length) {
            showQuestion();
        } else {
            clearInterval(timerInterval);
            finishExam();
        }
    }

    async function finishExam() {
        document.getElementById('appBody').innerHTML = `
            <div style="padding:100px 20px; text-align:center;">
                <div class="loader"></div>
                <h3>Saving 100-Question Metrics...</h3>
            </div>
        `;

        const percentage = (score / sessionQs.length) * 100;
        let grade = "Fail";
        if (percentage >= 80) grade = "S (Excellent)";
        else if (percentage >= 50) grade = "A (Pass)";
        
        const timeDiffMs = Date.now() - startTimeStamp;
        const totalTimeSecs = Math.floor(timeDiffMs / 1000);
        const displayMins = Math.floor(totalTimeSecs / 60);
        const displaySecs = totalTimeSecs % 60;
        const timeTakenStr = `${displayMins}m ${displaySecs}s`;

        const payload = {
            type: 'logs',
            action: 'save',
            row: [new Date().toLocaleString() + " (Final)", studentInfo.name, studentInfo.phone, `${score}/${sessionQs.length}`, grade, "Level 1", timeTakenStr]
        };

        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            
            document.getElementById('appBody').innerHTML = `
                <div class="brand-header"><h1>EXAM COMPLETED</h1></div>
                <div class="view-content fade-in" style="text-align:center; max-width: 600px; margin: auto;">
                    <div style="font-size:60px; font-weight:bold; color:var(--dark);">${score}/${sessionQs.length}</div>
                    <div style="margin:5px 0;"><span style="background:var(--primary); color:white; padding:8px 20px; border-radius:50px; font-weight:bold;">GRADE: ${grade}</span></div>
                    <p style="font-size:14px; margin: 12px 0; color: #555;"><b>Total Duration Used:</b> ${timeTakenStr}</p>
                    
                    <button class="btn-prime" style="background:#202124; margin-top:20px;" onclick="showReviewPage()">
                        <i class="fas fa-clipboard-check"></i> VIEW DETAILED REVIEW / उत्तर कुंजी समीक्षा
                    </button>
                    <button class="btn-prime" style="margin-top:15px;" onclick="location.reload()">RE-START MEGA TEST</button>
                </div>
            `;
        } catch (e) {
            alert("Cloud Save Failed!");
        }
    }

    function showReviewPage() {
        let reviewHtml = `
            <div class="brand-header">
                <h1>EXAM ANSWER KEY / समीक्षा पृष्ठ</h1>
                <p style="margin:5px 0 0; font-size:12px;">Saare 100 sawalon ka deep dual-language review niche hai</p>
            </div>
            <div class="view-content fade-in" style="max-height:550px; overflow-y:auto; text-align:left;">
        `;

        studentResponses.forEach((res, index) => {
            const labels = ['A', 'B', 'C', 'D'];
            
            let engQ = parseLanguageSplit(res.question, false);
            let hinQ = parseLanguageSplit(res.question, true);

            reviewHtml += `
                <div class="review-item">
                    <b>Q${index+1}.</b>
                    <div class="review-split">
                        <div class="rev-side"><b>ENG:</b> ${engQ}</div>
                        <div class="rev-side" style="border-left: 3px solid #e65100;"><b>HIN:</b> ${hinQ}</div>
                    </div>
                    <div style="margin-top:10px;">
            `;

            res.options.forEach((optText, i) => {
                if(optText && optText.toString().trim() !== "" && optText.toString().trim() !== "-") {
                    let optClass = "";
                    let icon = `<span class="opt-id" style="width:20px; height:20px; font-size:10px;">${labels[i]}</span>`;

                    if(res.userAns === labels[i]) {
                        if(res.userAns === res.correctAns) {
                            optClass = "rev-correct";
                            icon = `<i class="fas fa-check-circle" style="color:var(--success); margin-right:12px;"></i>`;
                        } else {
                            optClass = "rev-wrong";
                            icon = `<i class="fas fa-times-circle" style="color:var(--danger); margin-right:12px;"></i>`;
                        }
                    } else if(res.correctAns === labels[i]) {
                        optClass = "rev-correct";
                        icon = `<i class="fas fa-check-circle" style="color:var(--success); margin-right:12px;"></i>`;
                    }

                    let oEng = parseLanguageSplit(optText, false);
                    let oHin = parseLanguageSplit(optText, true);

                    reviewHtml += `<div class="review-opt ${optClass}">${icon} <span>${oEng} / <small style="color:#666;">${oHin}</small></span></div>`;
                }
            });

            reviewHtml += `</div><div class="ans-badge">CORRECT ANSWER: OPTION ${res.correctAns}</div></div>`;
        });

        reviewHtml += `
                <button class="btn-prime" style="margin-top:20px;" onclick="location.reload()">RE-START MEGA TEST</button>
            </div>
        `;

        document.getElementById('appBody').innerHTML = reviewHtml;
    }
</script>
</body>
</html>
