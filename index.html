<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>R07 EXAM | LRK INSTITUTE</title>
    <style>
        :root { --red: #ff0000; --dark: #000; }
        body { 
            background: var(--dark); color: white; font-family: 'Poppins', sans-serif; 
            margin: 0; overflow: hidden; height: 100vh;
        }
        /* Scanner Animation */
        body::after {
            content: ""; position: fixed; top: -100%; left: 0; width: 100%; height: 50px;
            background: linear-gradient(to bottom, transparent, rgba(255,0,0,0.3));
            animation: scan 4s linear infinite; z-index: 100; pointer-events: none;
        }
        @keyframes scan { 0% { top: -100%; } 100% { top: 100%; } }

        .main-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 550px; background: rgba(10, 10, 10, 0.95);
            border: 2px solid var(--red); border-radius: 20px; padding: 40px;
            box-shadow: 0 0 50px rgba(255,0,0,0.2);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--red); letter-spacing: 4px; margin: 0; font-size: 28px; }
        .header p { color: #888; font-size: 12px; text-transform: uppercase; }

        input {
            width: 100%; padding: 18px; margin: 15px 0; background: #111;
            border: 1px solid #333; color: white; border-radius: 12px; box-sizing: border-box;
            outline: none; font-size: 16px;
        }
        .btn-start {
            width: 100%; padding: 18px; background: var(--red); border: none;
            color: white; border-radius: 12px; font-weight: bold; cursor: pointer;
            letter-spacing: 2px; font-size: 16px; transition: 0.3s;
        }
        .btn-start:hover { box-shadow: 0 0 20px var(--red); }

        .opt-card {
            background: #111; padding: 15px; margin: 12px 0; border-radius: 10px;
            border: 1px solid #333; cursor: pointer; transition: 0.2s;
        }
        .opt-card:hover { border-color: var(--red); background: #1a0000; }
        .opt-card.active { border-color: var(--red); background: var(--red); }
        
        #quiz-screen, #result-screen { display: none; }
    </style>
</head>
<body>

    <div class="main-box">
        <div id="login-screen">
            <div class="header">
                <h1>R07 PRO</h1>
                <p>LRK COMPUTER INSTITUTE MIHINPURWA</p>
            </div>
            <input type="text" id="stuName" placeholder="Full Name">
            <input type="number" id="stuPhone" placeholder="10 Digit Phone Number">
            <button class="btn-start" onclick="startTest()">AUTHORIZE & START</button>
        </div>

        <div id="quiz-screen">
            <div id="qCount" style="color:var(--red); font-weight:bold; margin-bottom:15px;"></div>
            <div id="qEng" style="font-size:18px; margin-bottom:5px;"></div>
            <div id="qHin" style="color:#ff6666; font-size:15px; font-style:italic; margin-bottom:20px;"></div>
            <div id="options"></div>
            <button class="btn-start" onclick="nextQ()" style="margin-top:20px;">CONFIRM & NEXT</button>
        </div>

        <div id="result-screen" style="text-align:center;">
            <h1 style="color:var(--red);">EXAM COMPLETED</h1>
            <p>Your score has been synced to LRK Server</p>
            <div id="scoreVal" style="font-size:60px; margin:20px 0;"></div>
            <button class="btn-start" onclick="location.reload()">LOGOUT</button>
        </div>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIArbfM8Z1rWkGh8OpJMbSrdGN7Fenh3ffG8jX_WeGKuuSwG6P-hFMkWqF_wOD-6fS/exec";
    let questions = [], curIdx = 0, score = 0, answers = [], student = {};

    async function translate(text) {
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=hi&dt=t&q=${encodeURI(text)}`);
            const data = await res.json(); return data[0][0][0];
        } catch(e) { return "..."; }
    }

    async function startTest() {
        const name = document.getElementById('stuName').value;
        const phone = document.getElementById('stuPhone').value;
        if(!name || phone.length < 10) return alert("Invalid Credentials!");

        document.getElementById('login-screen').innerHTML = "<h2 style='color:red; text-align:center;'>BYPASSING SECURITY... SYNCING CLOUD</h2>";

        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        questions = data.questions.slice(1).map(x => ({id:x[0], q:x[1], a:x[2], b:x[3], c:x[4], d:x[5], ans:x[6]}));

        student = {name, phone};
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQ();
    }

    async function loadQ() {
        const q = questions[curIdx];
        document.getElementById('qCount').innerText = `Q. ${curIdx + 1} / ${questions.length}`;
        document.getElementById('qEng').innerText = q.q;
        document.getElementById('qHin').innerText = await translate(q.q);
        
        const optBox = document.getElementById('options');
        optBox.innerHTML = "";
        ['a','b','c','d'].forEach(async (k) => {
            if(q[k]) {
                const hOpt = await translate(q[k]);
                const div = document.createElement('div');
                div.className = 'opt-card';
                div.innerHTML = `<b>${k.toUpperCase()}.</b> ${q[k]} <br><small style="opacity:0.6">${hOpt}</small>`;
                div.onclick = () => {
                    document.querySelectorAll('.opt-card').forEach(o => o.classList.remove('active'));
                    div.classList.add('active');
                    answers[curIdx] = k.toUpperCase();
                };
                optBox.appendChild(div);
            }
        });
    }

    function nextQ() {
        if(!answers[curIdx]) return alert("Please select an answer!");
        if(curIdx < questions.length - 1) { curIdx++; loadQ(); } else { finish(); }
    }

    async function finish() {
        document.getElementById('quiz-screen').innerHTML = "<h2>UPLOADING RESULTS...</h2>";
        score = 0;
        questions.forEach((q, i) => { if(answers[i] === q.ans) score++; });

        await fetch(SCRIPT_URL, { 
            method: 'POST', mode: 'no-cors', 
            body: JSON.stringify({ type: 'logs', row: [new Date().toLocaleString(), student.name, student.phone, `${score}/${questions.length}`] }) 
        });
        
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('scoreVal').innerText = `${score} / ${questions.length}`;
    }
</script>
</body>
</html>
